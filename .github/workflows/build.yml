name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        run: scripts/build-app.sh
      - name: Zip app
        run: cd build && ditto -c -k --keepParent "Thakaali Timer.app" ThakaaliTimer.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ThakaaliTimer
          path: build/ThakaaliTimer.zip
